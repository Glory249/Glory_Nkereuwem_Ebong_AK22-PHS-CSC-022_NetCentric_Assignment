<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Metric Conversion System</title>

<style>

/* Footer */

footer{
    margin-top:50px;
    background:#003366;
    color:white;
    text-align:center;
    padding:20px;
}

footer a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

footer a:hover{
    text-decoration:underline;
}


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#edf2f7;
}

.container{
    width:90%;
    max-width:850px;
    margin:50px auto;
}

.header{
    background:linear-gradient(135deg,#003366,#0055aa);
    color:#fff;
    padding:30px;
    text-align:center;
    border-radius:15px 15px 0 0;
}

.header h1{
    font-size:34px;
}

.header p{
    margin-top:10px;
}

.form-box{

    background:#fff;

    padding:30px;

    border-radius:0 0 15px 15px;

    box-shadow:0 10px 25px rgba(0,0,0,.12);

}

label{

    display:block;

    margin-top:20px;

    margin-bottom:8px;

    color:#003366;

    font-weight:bold;

}

input,
select{

    width:100%;

    padding:14px;

    border:1px solid #ddd;

    border-radius:8px;

    font-size:16px;

}

input:focus,
select:focus{

    outline:none;

    border-color:#0055aa;

}

button{

    width:100%;

    margin-top:25px;

    padding:15px;

    background:#003366;

    color:#fff;

    border:none;

    border-radius:8px;

    font-size:18px;

    cursor:pointer;

}

button:hover{

    background:#0055aa;

}

.history-title{

    text-align:center;

    margin:40px 0 20px;

    color:#003366;

}

.history-card{

    background:#fff;

    padding:20px;

    border-left:6px solid #003366;

    border-radius:10px;

    margin-bottom:20px;

    box-shadow:0 4px 15px rgba(0,0,0,.1);

}

.history-card h3{

    color:#003366;

}

.history-card p{

    margin:8px 0;

}

.date{

    color:gray;

    font-size:14px;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>Metric Conversion System</h1>

<p>Convert measurements and save history online.</p>

</div>

<div class="form-box">

<form id="convertForm">

<label>Student Name</label>

<input
type="text"
id="name"
placeholder="Enter Student Name"
required>

<label>Conversion Type</label>

<select id="type">

<option>CM → M</option>

<option>KM → M</option>

<option>KG → G</option>

</select>

<label>Enter Value</label>

<input
type="number"
id="value"
placeholder="Enter Value"
required>

<button type="submit">

Convert Measurement

</button>

</form>

</div>

<h2 class="history-title">

Conversion History

</h2>

<div id="history"></div>

</div>

<script src="js/conversion.js"></script>

<footer>

<p>
&copy; 2026 Glory Retail Shop | Designed by Glory Nkereuwem Ebong
</p>

<p style="margin-top:10px;">
    <a href="admin.html">
        Admin Dashboard
    </a>
</p>

</footer>


</body>

</html>
