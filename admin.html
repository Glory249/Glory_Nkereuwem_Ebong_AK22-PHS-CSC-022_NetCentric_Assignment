<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f5f5f5;
overflow-x:hidden;
}

header{
background:#003366;
color:#fff;
padding:20px;
text-align:center;
}

.back-btn{
display:inline-block;
margin:20px;
padding:10px 20px;
background:#003366;
color:#fff;
text-decoration:none;
border-radius:5px;
}

.back-btn:hover{
background:#0055aa;
}

.container{
width:95%;
max-width:1200px;
margin:auto;
padding-bottom:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:#fff;
padding:25px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.card h2{
font-size:35px;
color:#003366;
margin-bottom:10px;
}

.card p{
font-size:18px;
}

.section{
background:#fff;
padding:20px;
margin-bottom:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.section h2{
margin-bottom:20px;
color:#003366;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:5px;
margin-bottom:20px;
font-size:16px;
}

.table-wrapper{
width:100%;
overflow-x:auto;
-webkit-overflow-scrolling:touch;
}

table{
width:100%;
min-width:700px;
border-collapse:collapse;
}

table th,
table td{
padding:12px;
border:1px solid #ddd;
text-align:left;
white-space:nowrap;
}

table th{
background:#003366;
color:white;
}

@media(max-width:768px){

.container{
width:95%;
}

.cards{
grid-template-columns:1fr;
}

.card h2{
font-size:28px;
}

.section{
padding:15px;
}

.section h2{
font-size:20px;
}

.back-btn{
display:block;
width:120px;
margin:20px auto;
text-align:center;
}

table{
min-width:650px;
}

table th,
table td{
font-size:14px;
padding:10px;
}

}

</style>

</head>

<body>

<a href="Portfolio.html" class="back-btn">
← Back
</a>

<header>

<h1>Admin Dashboard</h1>

</header>

<div class="container">

<div class="cards">

<div class="card">
<h2 id="reviewCount">0</h2>
<p>Total Reviews</p>
</div>

<div class="card">
<h2 id="contactCount">0</h2>
<p>Contact Messages</p>
</div>

<div class="card">
<h2 id="conversionCount">0</h2>
<p>Conversions</p>
</div>

<div class="card">
<h2 id="orderCount">0</h2>
<p>Total Orders</p>
</div>

</div>

<div class="section">

<h2>Search Customer</h2>

<input
type="text"
id="search"
placeholder="Search by Name or Email">

</div>

<div class="section">

<h2>Customer Messages</h2>

<div class="table-wrapper">

<table>

<thead>

<tr>
<th>Name</th>
<th>Email</th>
<th>Subject</th>
<th>Message</th>
</tr>

</thead>

<tbody id="contactTable">

</tbody>

</table>

</div>

</div>

<div class="section">

<h2>Reviews</h2>

<div class="table-wrapper">

<table>

<thead>

<tr>
<th>Name</th>
<th>Department</th>
<th>Rating</th>
<th>Review</th>
</tr>

</thead>

<tbody id="reviewTable">

</tbody>

</table>

</div>

</div>

<div class="section">

<h2>Conversions</h2>

<div class="table-wrapper">

<table>

<thead>

<tr>
<th>Conversion</th>
<th>Input</th>
<th>Result</th>
</tr>

</thead>

<tbody id="conversionTable">

</tbody>

</table>

</div>

</div>

<div class="section">

<h2>Orders</h2>

<div class="table-wrapper">

<table>

<thead>

<tr>
<th>Customer</th>
<th>Product</th>
<th>Quantity</th>
<th>Amount</th>
<th>Phone</th>
<th>Payment Ref</th>
</tr>

</thead>

<tbody id="orderTable">

</tbody>

</table>

</div>

</div>

</div>

<script src="js/admin.js"></script>

</body>
</html>
