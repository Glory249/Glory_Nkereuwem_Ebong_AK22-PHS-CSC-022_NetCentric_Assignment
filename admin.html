<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#003366;
color:white;
padding:20px;
text-align:center;
}

.container{
width:95%;
max-width:1200px;
margin:30px auto;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.card h2{
color:#003366;
font-size:35px;
margin-bottom:10px;
}

.card p{
font-size:18px;
}

.section{

background:white;
padding:25px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
margin-bottom:30px;

}

.section h2{

margin-bottom:20px;
color:#003366;

}

input{

width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:5px;
margin-bottom:20px;

}

table{

width:100%;
border-collapse:collapse;

}

table th,
table td{

padding:12px;
border:1px solid #ddd;
text-align:left;

}

table th{

background:#003366;
color:white;

}

</style>

</head>

<body>
<a href="Portfolio.html" class="back-btn">
    ← Back
<header>

<h1>Admin Dashboard</h1>

</header>

<div class="container">

<div class="cards">

<div class="card">

<h2 id="reviewCount">0</h2>

<p>Total Reviews</p>

</div>

<div class="card">

<h2 id="contactCount">0</h2>

<p>Contact Messages</p>

</div>

<div class="card">

<h2 id="conversionCount">0</h2>

<p>Conversions</p>

</div>

<div class="card">

    <h2 id="orderCount">0</h2>

    <p>Total Orders</p>

</div>

</div>

<div class="section">

<h2>Search Customer</h2>

<input
type="text"
id="search"
placeholder="Search by Name or Email">

</div>

<div class="section">

<h2>Customer Messages</h2>

<table>

<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Subject</th>

<th>Message</th>

</tr>

</thead>

<tbody id="contactTable">

</tbody>

</table>

</div>

<div class="section">

<h2>Reviews</h2>

<table>

<thead>

<tr>

<th>Name</th>

<th>Department</th>

<th>Rating</th>

<th>Review</th>

</tr>

</thead>

<tbody id="reviewTable">

</tbody>

</table>

</div>

<div class="section">

<h2>Conversions</h2>

<table>

<thead>

<tr>

<th>Conversion</th>

<th>Input</th>

<th>Result</th>

</tr>

</thead>

<tbody id="conversionTable">

</tbody>

</table>

</div>

<div class="section">

    <h2>Orders</h2>

    <table>

        <thead>

            <tr>

                <th>Customer</th>

                <th>Product</th>

                <th>Quantity</th>

                <th>Amount</th>

                <th>Phone</th>

                <th>Payment Ref</th>

            </tr>

        </thead>

        <tbody id="orderTable">

        </tbody>

    </table>

</div>

</div>

<script src="js/admin.js"></script>

</body>

</html>
